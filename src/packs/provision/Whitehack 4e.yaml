  - sort: 200000
    name: Magick Cost Guidelines (p. 37)
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: "<table style=\"border:1px solid #000\"><caption>Magic Cost Guidelines\
        \ (p.\_37)</caption><thead><tr class=\"header\"><th style=\"width:3em;text-align:center\"\
        >HP</th><th style=\"text-align:left\">Magnitudes</th></tr></thead><tbody><tr\
        \ class=\"odd\"><td style=\"text-align:center\">0</td><td style=\"text-align:left\"\
        ><strong>Zero,</strong> trivial effect, slotted scroll or simple effect boosted\
        \ by a limiting condition.</td></tr><tr class=\"even\"><td style=\"text-align:center\"\
        >1</td><td style=\"text-align:left\"><strong>Simple,</strong> can be achieved\
        \ without magick. Example: minor harming or healing, illumination, unlocking,\
        \ reading a foreign language.</td></tr><tr class=\"odd\"><td style=\"text-align:center\"\
        >2</td><td style=\"text-align:left\"><strong>Standard,</strong> just beyond\
        \ the possible. Example: generating a protective force field, breathing water,\
        \ light telekinesis, invisibility.</td></tr><tr class=\"even\"><td style=\"\
        text-align:center\">d6</td><td style=\"text-align:left\"><strong>Major,</strong>\
        \ a major breach of natural law. Example: teleporting, animating skeletons,\
        \ locating lost things/beings, dispelling, removing an injury.</td></tr><tr\
        \ class=\"odd\"><td style=\"text-align:center\">2d6</td><td style=\"text-align:left\"\
        ><strong>Powerful,</strong> use of raw power. Example: resurrection, changing\
        \ the weather, stopping time, petrification, cloning.</td></tr><tr class=\"\
        even\"><td style=\"text-align:center\">+</td><td style=\"text-align:left\"\
        ><strong>Costly.</strong> Peripheral to vocation or wording. Extra duration,\
        \ range, effect area, victims, damage. No save. Craft item (Cost \xD7 2).\
        \ Adding another charge (Cost \xD7 1). Crafting a permanent magick item (Cost\
        \ \xD7 2 permanent hp). Expensive magick type.</td></tr><tr class=\"odd\"\
        ><td style=\"text-align:center\">\u2212</td><td style=\"text-align:left\"\
        ><strong>Cheaper.</strong> Very close to vocation and/or wording. Rare/costly\
        \ ingredients. Bad side effects for the Wise. Wise save (fail negates). Boosting\
        \ but addictive drugs. Cheap magick type. Extra casting time. Time or place\
        \ requirements.</td></tr></tbody></table>"
