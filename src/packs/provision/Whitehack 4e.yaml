  - name: Roll Selected Monster HP
    type: script
    scope: global
    author: AmSZ6wDILZ3oAGUL
    img: icons/magic/life/cross-worn-green.webp
    command: >-
      // Contributed by fred-o <https://github.com/fred-o>:
      https://github.com/neilbenson/foundryvtt-whitehack-3e/issues/8

      for await (const token of canvas.tokens.controlled) {
        const a = token.actor
        if (a.type === 'Monster' && !a.system.harmPoints.max) {
          const hd = a.system.combat.harmDice
          let r = new Roll(`${hd.base}d6 + @modifier`, hd)
          await r.evaluate()
          a.update({
            system: {
              harmPoints: {
                max: r.total,
                value: r.total
              }
            }
          })
          console.log(`Rolled HP ${r.total} for ${a.name}`)
        }
      }
