        \ but they are also examples of how to adapt the generic equipment list to\
        \ match a particular world. Swap them for a more generic \u201Cbroad- blade,\u201D\
        \ dog and horse if you like, or, in a modern setting, you could swap them\
        \ for a machete, simple bot and a motorcycle.</p>"
