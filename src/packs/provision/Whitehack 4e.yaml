    type: script
    author: AmSZ6wDILZ3oAGUL
    img: icons/magic/life/crosses-trio-red.webp
    scope: global
    command: |-
      let confirmed = false;

      new Dialog({
        title: "Roll Harm Points from HD",
        content: `
            <form>
              <div class="form-group">
                <label style="text-align: right; margin-right: 0.5em;">HD:</label>
                <input id="hd-value" name="hd-value"></input>
              </div>
              <div class="form-group">
                <label style="text-align: right; margin-right: 0.5em;">±:</label>
                <input id="hd-modifier" name="hd-modifier" placeholder="0"></input>
              </div>
            </form>
           `,
        buttons: {
          one: {
            icon: '<i class="fas fa-check"></i>',
            label: "Roll!",
            callback: () => (confirmed = true),
          },
          two: {
            icon: '<i class="fas fa-times"></i>',
            label: "Cancel",
            callback: () => (confirmed = false),
          },
        },
        default: "Cancel",
        close: (html) => {
          if (confirmed) {
            let hdLabel;
            let rollFormula;
            const hd = html.find("[name=hd-value]")[0].value;
            const hdModifier = parseInt(html.find("[name=hd-modifier]")[0].value);
            if (hdModifier > 0) {
              hdLabel = `${hd}+${hdModifier}`;
              rollFormula = `${hd}d6+${hdModifier}`;
            } else if (hdModifier < 0) {
              hdLabel = `${hd}${hdModifier}`;
              rollFormula = `{${hd}d6${hdModifier},1}kh`;
            } else {
              hdLabel = hd;
              rollFormula = `${hd}d6`;
            }
            let label = `Roll Harm Points for HD: ${hdLabel}`;
            let message = `
              <table>
                <tbody>
                  <tr class="odd">
                    <td style="text-align: right;">1–5: </td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                  </tr>
                  <tr class="even">
                    <td style="text-align: right;">6–10: </td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                  </tr>
                  <tr class="odd">
                    <td style="text-align: right;">11–15: </td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                  </tr>
                  <tr class="even">
                    <td style="text-align: right;">16–20: </td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                    <td style="text-align: right;">[[${rollFormula}]]</td>
                  </tr>
                </tbody>
              </table>
            `;
            ChatMessage.create({
              content: message,
              whisper: game.users.filter((u) => u.isGM).map((u) => u.id),
              blind: true,
              flavor: label,
            });
          }
        },
      }).render(true);
