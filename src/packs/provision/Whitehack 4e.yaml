      - sort: 800000
        name: Attitudes & Parley (p. 55)
        type: text
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<p>@UUID[Compendium.whitehack4e.roll-table.RollTable.m6mb9aLi6cUzVknA]{Reactions &amp; Parley}</p><ul><li>Make a <strong>Charisma</strong> roll modified by <strong>Parley</strong> to change the attitude one level better or worse.</li><li>Apply -2 for each <em>additional</em> step of change.</li><li>Apply -6 if there is no mutual language.</li></ul><table style=\"border:1px solid #000;width:50%;margin:0;margin-left:auto;margin-right:auto\"><caption>Non-Player Character Reactions (p.\_55)</caption><thead><tr class=\"header\"><th style=\"text-align:center\">3d6</th><th style=\"text-align:center\">Reaction</th><th style=\"text-align:center\">Parley</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:center\">3</td><td style=\"text-align:center\">Furious</td><td style=\"text-align:center\">-6</td></tr><tr class=\"even\"><td style=\"text-align:center\">4–5</td><td style=\"text-align:center\">Hostile</td><td style=\"text-align:center\">-4</td></tr><tr class=\"odd\"><td style=\"text-align:center\">6–9</td><td style=\"text-align:center\">Negative</td><td style=\"text-align:center\">-2</td></tr><tr class=\"even\"><td style=\"text-align:center\">10–13</td><td style=\"text-align:center\">Neutral</td><td style=\"text-align:center\">±0</td></tr><tr class=\"odd\"><td style=\"text-align:center\">14–16</td><td style=\"text-align:center\">Positive</td><td style=\"text-align:center\">-2</td></tr><tr class=\"even\"><td style=\"text-align:center\">17+</td><td style=\"text-align:center\">Happy</td><td style=\"text-align:center\">-4</td></tr></tbody></table>"
