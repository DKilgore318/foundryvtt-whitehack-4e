  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: quirk
    description: <p>Enemies choose to attack someone other than the brave character
      first, at the start of a battle&mdash;if there is anyone else to attack! This
      ability can be inverted if and when the player wishes.</p>
    activeStatus: inactive
  effects: []
  sort: 0
