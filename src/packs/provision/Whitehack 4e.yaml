        >16</td><td style=\"text-align:left;padding-left:0.25em\">Is confused. Must\
        \ save or attack nearest ally.</td></tr><tr class=\"odd\"><td style=\"text-align:center\"\
        >17</td><td style=\"text-align:left;padding-left:0.25em\">Must save or attack\
