  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: quirk
    description: <p>They get +4 sv vs. cursed objects and may use comeback dice to
      reduce cursed hp costs.</p>
    activeStatus: inactive
