        text-align:center\">10</td><td style=\"text-align:left;padding-left:0.25em\"\
        >Is laid flat on the ground a few steps away.</td></tr><tr class=\"odd\"><td\
        \ style=\"text-align:center\">11</td><td style=\"text-align:left;padding-left:0.25em\"\
