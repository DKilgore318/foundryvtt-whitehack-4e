    type: quirk
    description: <p>Once per session, the Brave can use a god&rsquo;s name to halt,
      scare, convince, bless or curse their level number of listeners, none of which
      can have a higher level than the Brave (+1 for a holy symbol or divine affiliation).
      Each target may choose to save to avoid the effect.</p>
    activeStatus: inactive
  effects: []
  sort: 0
