  - sort: 1300000
    name: Corruption (p. 76)
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: "<table style=\"border:1px solid #000\"><caption>Effects of Corruption\
        \ (p.\_76)</caption><thead><tr class=\"header\"><th style=\"width:4em;text-align:center\"\
        >CL</th><th style=\"text-align:left\">Effect</th></tr></thead><tbody><tr class=\"\
        odd\"><td style=\"text-align:center\">1\u20133</td><td style=\"text-align:left\"\
        >A minor effect in behavior or looks. It can be hidden from cursory examinations\
        \ and goes away after a day or two.</td></tr><tr class=\"even\"><td style=\"\
        text-align:center\">4\u20136</td><td style=\"text-align:left\">A major effect\
        \ that cannot be hidden, but goes away after a day or two.</td></tr><tr class=\"\
        odd\"><td style=\"text-align:center\">7\u201310</td><td style=\"text-align:left\"\
        >A major effect that goes away after d6 weeks. The player is obliged to save\
        \ at this level.</td></tr><tr class=\"even\"><td style=\"text-align:center\"\
        >10+</td><td style=\"text-align:left\">A major effect that is permanent. The\
        \ player is obliged to save at this level. If CL exceeds 10+level, the character\
        \ is lost to corruption. Roll a new character.</td></tr></tbody></table>"
