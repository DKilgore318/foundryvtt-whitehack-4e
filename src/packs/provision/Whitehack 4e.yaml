    description: ''
    activeStatus: inactive
  effects: []
  sort: 0
- name: 2. Move Opponent
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>After a successful attack, the Strong may eschew damage to force
      an opponent to a space designated by the Strong, within ten feet from the opponent&rsquo;s
      prior location. In melee, as a free move, the Strong may take that prior place
      instead. The target of this effect is allowed a save to negate it. The target
      may become subject to free attacks as a consequence of the maneuver.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 6. Encourage (+1 AV/SV)
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>With a small verbal action, the Strong may encourage their friends
      in a 15 feet radius, giving them +1 av and +1 sv. This ability can be inverted
      to put fear in enemies (15 ft radius, -1 av and sv).</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 4. Init/MV Penalties OR Damage
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>In a successful attack, the Strong may eschew a damage roll and
      cause -2 initiative, -10 mv, or two points of ongoing damage per round. The
      player must describe how this is achieved. A save can halt the last two conditions
      after at least one round in effect.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 1. Protect Adjacent
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>As a full round action, the Strong may protect an adjacent character
      by letting all attacks directed at her until their next turn target them instead.
      Each enemy is allowed a save against this effect.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 8. Parry (+2 DF/Dbl Combat Adv)
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>The Strong can parry and wait instead of attacking. They get +2
      df in the parrying round, then double combat advantage in the next round against
      a parried enemy. They can parry two consecutive rounds to get <em>triple</em>
      combat advantage. If damaged in a parrying round, they must save or lose the
      effect.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 3. Cling/Climb
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>When fighting big opponents, the Strong can use one action to
      cling onto and even climb them with a successful agility roll, gaining double
      combat advantage (+4 av and damage, see p. 59) in the next and any subsequent
      round as long as they hang on. New agility rolls may be required at the Referee&rsquo;s
      discretion, but don&rsquo;t require separate actions. Anything that is clearly
      bigger than the character&rsquo;s species&mdash;like a human to a halfling&mdash;counts
      as a big opponent.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 7. Melee AND Ranged
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: combatOption
    description: <p>The Strong can forsake their move and make a melee and a ranged
      attack in one round, if they have suitable, one-handed weapons (e.g. a broadsword
      and a throwing knife).</p>
    activeStatus: inactive
  effects: []
  sort: 0
