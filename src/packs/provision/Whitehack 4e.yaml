        name: Energy Concentrations (p. 38)
        type: text
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<p>The Wise may save once per day and spend 10 minutes to detect and use a local energy concentration, making a single effect of a certain type one magnitude cheaper. Check the save quality against the Energy Concentrations table.</p><table style=\"border:1px solid #000\"><caption>Energy Concentrations (p.\_38)</caption><thead><tr class=\"header\"><th style=\"width:5em;text-align:center\">Quality</th><th style=\"text-align:left\">Energy for…</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:center\">1</td><td style=\"text-align:left\">Summoning</td></tr><tr class=\"even\"><td style=\"text-align:center\">2</td><td style=\"text-align:left\">Elemental control</td></tr><tr class=\"odd\"><td style=\"text-align:center\">3</td><td style=\"text-align:left\">Necromancy</td></tr><tr class=\"even\"><td style=\"text-align:center\">4</td><td style=\"text-align:left\">Protection and banishment</td></tr><tr class=\"odd\"><td style=\"text-align:center\">5</td><td style=\"text-align:left\">Illusions</td></tr><tr class=\"even\"><td style=\"text-align:center\">6</td><td style=\"text-align:left\">Information</td></tr><tr class=\"odd\"><td style=\"text-align:center\">7</td><td style=\"text-align:left\">Material alterations</td></tr><tr class=\"even\"><td style=\"text-align:center\">8</td><td style=\"text-align:left\">Mind influence</td></tr><tr class=\"odd\"><td style=\"text-align:center\">9+</td><td style=\"text-align:left\">Player choice</td></tr></tbody></table>"
