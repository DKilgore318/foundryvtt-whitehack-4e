      - sort: 900000
        name: Crits & Fumbles (p. 58)
        type: text
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<h2>Crits</h2><p>@UUID[Compendium.whitehack4e.roll-table.RollTable.240TP0UMvm5wjgXB]{Crits}</p><table style=\"border:1px solid #000\"><caption>Attack Crits (p.\_58)</caption><thead><tr class=\"header\"><th style=\"width:4em;text-align:center\">d20</th><th style=\"text-align:left;padding-left:0.25em\">The target(’s)…</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:center\">1</td><td style=\"text-align:left;padding-left:0.25em\">Weapon flies 10 ft away.</td></tr><tr class=\"even\"><td style=\"text-align:center\">2</td><td style=\"text-align:left;padding-left:0.25em\">Shield drops 5 ft away.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">3</td><td style=\"text-align:left;padding-left:0.25em\">Weapon breaks. It can be mended.</td></tr><tr class=\"even\"><td style=\"text-align:center\">4</td><td style=\"text-align:left;padding-left:0.25em\">Shield is ruined.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">5</td><td style=\"text-align:left;padding-left:0.25em\">Armor loses d6 df. It can be mended.</td></tr><tr class=\"even\"><td style=\"text-align:center\">6</td><td style=\"text-align:left;padding-left:0.25em\">Is hurt and gets halved movement.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">7</td><td style=\"text-align:left;padding-left:0.25em\">Speech is impossible for 10 minutes.</td></tr><tr class=\"even\"><td style=\"text-align:center\">8</td><td style=\"text-align:left;padding-left:0.25em\">Screams at the top of her lungs.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">9</td><td style=\"text-align:left;padding-left:0.25em\">Is blinded for 10 min. Related actions are −10.</td></tr><tr class=\"even\"><td style=\"text-align:center\">10</td><td style=\"text-align:left;padding-left:0.25em\">Is laid flat on the ground a few steps away.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">11</td><td style=\"text-align:left;padding-left:0.25em\">Must save or attempt to flee.</td></tr><tr class=\"even\"><td style=\"text-align:center\">12</td><td style=\"text-align:left;padding-left:0.25em\">Is deaf for 10 minutes.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">13</td><td style=\"text-align:left;padding-left:0.25em\">Starts to bleed. +1 damage every round.</td></tr><tr class=\"even\"><td style=\"text-align:center\">14</td><td style=\"text-align:left;padding-left:0.25em\">Takes an additional d6 damage.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">15</td><td style=\"text-align:left;padding-left:0.25em\">Is stunned for 2 rounds: mv 5, −4 df.</td></tr><tr class=\"even\"><td style=\"text-align:center\">16</td><td style=\"text-align:left;padding-left:0.25em\">Is confused. Must save or attack nearest ally.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">17</td><td style=\"text-align:left;padding-left:0.25em\">Must save or attack an ally and attempt to flee.</td></tr><tr class=\"even\"><td style=\"text-align:center\">18</td><td style=\"text-align:left;padding-left:0.25em\">Is shocked and defenseless until rested.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">19</td><td style=\"text-align:left;padding-left:0.25em\">Is knocked out at −1 hp or less.</td></tr><tr class=\"even\"><td style=\"text-align:center\">20</td><td style=\"text-align:left;padding-left:0.25em\">Meets a gory death. Allies check morale.</td></tr></tbody></table><h2>Fumbles</h2><p>@UUID[Compendium.whitehack4e.roll-table.RollTable.Kudugm51wCN5fDId]{Fumbles}</p><table style=\"border:1px solid #000\"><caption>Attack Fumbles (p.\_58)</caption><thead><tr class=\"header\"><th style=\"width:4em;text-align:center\">d6</th><th style=\"text-align:left;padding-left:0.25em\">The character(’s) …</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:center\">1</td><td style=\"text-align:left;padding-left:0.25em\">Weapon breaks. It can be mended.</td></tr><tr class=\"even\"><td style=\"text-align:center\">2</td><td style=\"text-align:left;padding-left:0.25em\">Armor or shield breaks. They can be mended.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">3</td><td style=\"text-align:left;padding-left:0.25em\">Weapon drops or gets stuck (player choice).</td></tr><tr class=\"even\"><td style=\"text-align:center\">4</td><td style=\"text-align:left;padding-left:0.25em\">Staggers and gets 2 rounds of halved movement.</td></tr><tr class=\"odd\"><td style=\"text-align:center\">5</td><td style=\"text-align:left;padding-left:0.25em\">Attacks the nearest ally (make an attack roll).</td></tr><tr class=\"even\"><td style=\"text-align:center\">6</td><td style=\"text-align:left;padding-left:0.25em\">Hits herself—roll damage!</td></tr></tbody></table>"
