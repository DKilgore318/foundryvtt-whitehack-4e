        >Roll</th><th style=\"text-align:left;padding-left:0.25em\">Result</th></tr></thead><tbody><tr\
        \ class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Fumble</td><td\
        \ style=\"text-align:left;padding-left:0.25em\">The miracle doesn\u2019t work.\
        \ You pay full hp anyway. Save or ruin the scroll.</td></tr><tr class=\"even\"\
        ><td style=\"text-align:left;padding-left:0.25em\">Fail</td><td style=\"text-align:left;padding-left:0.25em\"\
        >The miracle doesn\u2019t work. You only pay 1 hp and can try again later.</td></tr><tr\
        \ class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Success</td><td\
        \ style=\"text-align:left;padding-left:0.25em\">You pay full hp, the miracle\
        \ works as intended, and 1 charge is spent.</td></tr><tr class=\"even\"><td\
        \ style=\"text-align:left;padding-left:0.25em\">Double success</td><td style=\"\
        text-align:left;padding-left:0.25em\">You pay full hp, the miracle works as\
        \ intended, and no charge is spent.</td></tr><tr class=\"odd\"><td style=\"\
        text-align:left;padding-left:0.25em\">Crit</td><td style=\"text-align:left;padding-left:0.25em\"\
        >The miracle works without hp cost, and no charge is spent.</td></tr></tbody></table>"
