  - sort: 1400000
    name: Consequences of Base Stress (p. 90)
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: "<table style=\"border:1px solid #000\"><caption>Consequences of Base\
        \ Stress (p.\_90)</caption><thead><tr class=\"header\"><th style=\"width:4em;text-align:center\"\
        >Stress</th><th style=\"text-align:left\">Consequence</th></tr></thead><tbody><tr\
        \ class=\"odd\"><td style=\"text-align:center\">1\u20133</td><td style=\"\
        text-align:left\">Minor consequence. The base cannot provide service for the\
        \ next day.</td></tr><tr class=\"even\"><td style=\"text-align:center\">4\u2013\
        6</td><td style=\"text-align:left\">Standard consequence. The base is clearly\
        \ stressed. It cannot perform service for the next two days, and the Referee\
        \ may <strong>compromise</strong> the base.</td></tr><tr class=\"odd\"><td\
        \ style=\"text-align:center\">7\u20139</td><td style=\"text-align:left\">Serious\
        \ consequence. The base is weakened and cannot be used for a whole week. The\
        \ Referee may <strong>threaten</strong> the base. A save is obligatory.</td></tr><tr\
        \ class=\"even\"><td style=\"text-align:center\">10+</td><td style=\"text-align:left\"\
        >Deadly consequence. The base is depleted, and the Referee may <strong>destroy</strong>\
        \ it. A save is obligatory. Fumble means the base is lost. The base must transcend\
        \ before use.</td></tr></tbody></table>"
    video:
      controls: true
      volume: 0.5
    src: null
    system: {}
