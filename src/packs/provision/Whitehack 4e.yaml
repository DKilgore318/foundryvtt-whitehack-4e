  sort: 0
- name: 3. Protector
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: quirk
    description: <p>Choose a party member at the beginning of the session. When the
      character protects that party member, use one free comeback die for the roll.</p>
    activeStatus: inactive
  effects: []
  sort: 0
- name: 2. Brave Healing
  type: Ability
  img: systems/whitehack4e/assets/icons/svg/skills.svg
  system:
    type: quirk
    description: <p>They require no treatment to heal beyond 1 hp from a negative
      value, and can use comeback dice for the damage shrugged off on a successful
      save (p. 62).</p>
    activeStatus: inactive
  effects: []
  sort: 0
