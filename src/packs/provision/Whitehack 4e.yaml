        width:5em;text-align:left\">Success</th></tr></thead><tbody><tr class=\"odd\"\
        ><td style=\"text-align:center\">A</td><td style=\"text-align:left\">Animal</td><td\
        \ style=\"text-align:left\">Nothing</td><td style=\"text-align:left\">Food</td></tr><tr\
        \ class=\"even\"><td style=\"text-align:center\">R</td><td style=\"text-align:left\"\
        >Regular</td><td style=\"text-align:left\">Mundane and expected.</td><td style=\"\
        text-align:left\">Valuable</td></tr><tr class=\"odd\"><td style=\"text-align:center\"\
        >M</td><td style=\"text-align:left\">Monster</td><td style=\"text-align:left\"\
        >Valuable but still expected.</td><td style=\"text-align:left\">Rare</td></tr><tr\
        \ class=\"even\"><td style=\"text-align:center\">H</td><td style=\"text-align:left\"\
        >Hoard</td><td style=\"text-align:left\">Valuable, rare. Magick.</td><td style=\"\
        text-align:left\">Artifact(s)</td></tr></tbody></table>"
