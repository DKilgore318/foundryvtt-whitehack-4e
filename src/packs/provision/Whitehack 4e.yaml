        image: {}
        text:
          format: 1
          content: "<h2>Weapons</h2><table style=\"border:1px solid #000\"><caption>Weapons<sup>∗</sup> (p.\_61)</caption><colgroup><col style=\"width:8em\"></col><col style=\"width:10em\"></col><col style=\"width:4em\"></col><col style=\"width:1em\"></col><col style=\"width:2em\"></col><col style=\"width:3em\"></col><col style=\"width:3em\"></col></colgroup><thead><tr class=\"header\"><th style=\"text-align:left;padding-left:0.25em\">Weapon</th><th style=\"text-align:left;padding-left:0.25em\">Special</th><th style=\"text-align:center\">Dam.</th><th style=\"text-align:center\">W</th><th style=\"text-align:center\">R</th><th style=\"text-align:center\">RoF</th><th style=\"text-align:right;padding-right:0.25em\">CR</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Axe/Sword</td><td style=\"text-align:left;padding-left:0.25em\"></td><td style=\"text-align:center\">d6+1</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">20</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Club</td><td style=\"text-align:left;padding-left:0.25em\">Knock-out, improvised</td><td style=\"text-align:center\">d6−2</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">–</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Crossbow</td><td style=\"text-align:left;padding-left:0.25em\">Two handed</td><td style=\"text-align:center\">d6+1</td><td style=\"text-align:center\">H</td><td style=\"text-align:center\">70</td><td style=\"text-align:center\">1/2</td><td style=\"text-align:right;padding-right:0.25em\">50</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Dagger</td><td style=\"text-align:left;padding-left:0.25em\"></td><td style=\"text-align:center\">d6−2</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\">15</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">5</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Darts</td><td style=\"text-align:left;padding-left:0.25em\">1–3 equal a minor item</td><td style=\"text-align:center\">1</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\">20</td><td style=\"text-align:center\">3</td><td style=\"text-align:right;padding-right:0.25em\">3</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Flail</td><td style=\"text-align:left;padding-left:0.25em\">Ignore shield df</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">20</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Gr. sword/axe</td><td style=\"text-align:left;padding-left:0.25em\">Two handed</td><td style=\"text-align:center\">d6+2</td><td style=\"text-align:center\">H</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">40</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Javelin</td><td style=\"text-align:left;padding-left:0.25em\">d6−2 damage in melee</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\">40</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">4</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Longbow</td><td style=\"text-align:left;padding-left:0.25em\">Two handed</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\">70</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">25</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Mace/Hammer</td><td style=\"text-align:left;padding-left:0.25em\">+1 av vs.\_metal armor</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">20</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Morning Star</td><td style=\"text-align:left;padding-left:0.25em\">As above, ×3 crit dam.</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">H</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">25</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Musket</td><td style=\"text-align:left;padding-left:0.25em\">Two handed</td><td style=\"text-align:center\">d6+2</td><td style=\"text-align:center\">H</td><td style=\"text-align:center\">30</td><td style=\"text-align:center\">1/4</td><td style=\"text-align:right;padding-right:0.25em\">150</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Pistol</td><td style=\"text-align:left;padding-left:0.25em\"></td><td style=\"text-align:center\">d6+1</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\">20</td><td style=\"text-align:center\">1/3</td><td style=\"text-align:right;padding-right:0.25em\">100</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Pole arms</td><td style=\"text-align:left;padding-left:0.25em\">Two handed, reach</td><td style=\"text-align:center\">d6+1</td><td style=\"text-align:center\">H</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">25</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Quarterstaff</td><td style=\"text-align:left;padding-left:0.25em\">Two handed, reach</td><td style=\"text-align:center\">d6−1</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">2</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Scimitar</td><td style=\"text-align:left;padding-left:0.25em\">+1 av while riding</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">16</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Shortbow</td><td style=\"text-align:left;padding-left:0.25em\">Two handed, w. mount</td><td style=\"text-align:center\">d6−1</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\">50</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">20</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Shortsword</td><td style=\"text-align:left;padding-left:0.25em\"></td><td style=\"text-align:center\">d6−1</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">15</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Sling</td><td style=\"text-align:left;padding-left:0.25em\">Use with stones</td><td style=\"text-align:center\">d6−2</td><td style=\"text-align:center\">N</td><td style=\"text-align:center\">30</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">2</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Spear</td><td style=\"text-align:left;padding-left:0.25em\">Reach</td><td style=\"text-align:center\">d6</td><td style=\"text-align:center\">R</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">15</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Thr. Knife/Axe</td><td style=\"text-align:left;padding-left:0.25em\">−1 av in melee</td><td style=\"text-align:center\">d6−2</td><td style=\"text-align:center\">M</td><td style=\"text-align:center\">25</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">4</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Unarmed</td><td style=\"text-align:left;padding-left:0.25em\">Knock-out, grapple</td><td style=\"text-align:center\">d6−3</td><td style=\"text-align:center\">–</td><td style=\"text-align:center\"></td><td style=\"text-align:center\"></td><td style=\"text-align:right;padding-right:0.25em\">–</td></tr></tbody></table><p><sup>∗</sup>“W” means weight: No size (100/slot), Minor (2/slot), Regular (1 slot) and Heavy (2 slots). See p.\_44. “RoF” is the rate of fire in shots/round(s). Fire in the first round, then spend any remaining rounds reloading before you can fire again. You can’t move and reload weapons with fraction RoFs (crossbow, musket etc.).</p><h2>Armor</h2><table style=\"border:1px solid #000;width:50%;margin:0;margin-left:auto;margin-right:auto\"><caption>Armors (p.\_61)</caption><thead><tr class=\"header\"><th style=\"text-align:left;padding-left:0.25em\">Armor</th><th style=\"text-align:center\">DF</th><th style=\"text-align:right;padding-right:0.25em\">CR</th></tr></thead><tbody><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Shields</td><td style=\"text-align:center\">+1</td><td style=\"text-align:right;padding-right:0.25em\">30</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Cloth</td><td style=\"text-align:center\">1</td><td style=\"text-align:right;padding-right:0.25em\">15</td></tr><tr class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Leather</td><td style=\"text-align:cente