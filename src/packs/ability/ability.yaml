name: 5. Give Double Combat Advantage
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: combatOption
  description: <p>The Strong can give an ally double combat advantage once per battle,
    for a single attack made right away or later in that fight. This requires a tactical
    small verbal action, like &ldquo;strike when she flies!&rdquo;</p>
  activeStatus: inactive
effects: []
sort: 0
