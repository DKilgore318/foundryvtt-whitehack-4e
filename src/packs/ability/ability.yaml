name: 8. Improvised Weapons
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: quirk
  description: <p>Improvised weapons&mdash;a stone, a branch etc.&mdash;do at least
    1d6 damage, and actual weapons ignore target resistances (but not immunities).</p>
  activeStatus: inactive
effects: []
sort: 0
