name: 1. Combat Exploit
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: knacks
  description: <p>The Clever can exploit combat situations. The base bonus for combat
    advantage is +3 instead of +2, and once per battle they may switch the d6 for
    the d10 as damage die.</p>
  activeStatus: inactive
effects: []
sort: 0
---
name: 8. Parry (+2 DF/Dbl Combat Adv)
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: combatOption
  description: <p>The Strong can parry and wait instead of attacking. They get +2
    df in the parrying round, then double combat advantage in the next round against
    a parried enemy. They can parry two consecutive rounds to get <em>triple</em>
    combat advantage. If damaged in a parrying round, they must save or lose the effect.</p>
  activeStatus: inactive
effects: []
sort: 0
---
name: 4. Brave vs Cursed
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: quirk
  description: <p>They get +4 sv vs. cursed objects and may use comeback dice to reduce
    cursed hp costs.</p>
  activeStatus: inactive
effects: []
sort: 0
---
name: 2. Clever Crafting
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: knacks
  description: <p>When crafting, mending or putting something together, the Clever
    get +4, take half the time and can skip one part without loss of functionality,
    unless it is the most important part.</p>
  activeStatus: inactive
effects: []
sort: 0
