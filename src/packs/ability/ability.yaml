name: 4. Init/MV Penalties OR Damage
type: Ability
img: systems/whitehack4e/assets/icons/svg/skills.svg
system:
  type: combatOption
  description: <p>In a successful attack, the Strong may eschew a damage roll and
    cause -2 initiative, -10 mv, or two points of ongoing damage per round. The player
    must describe how this is achieved. A save can halt the last two conditions after
    at least one round in effect.</p>
  activeStatus: inactive
effects: []
sort: 0
