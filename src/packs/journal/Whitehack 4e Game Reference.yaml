- sort: 1700000
  name: Loot Rolls (p. 121)
  type: text
  title:
    show: false
    level: 1
  image: {}
  text:
    format: 1
    content: "<p>Make a task roll against <code>HD+LT modifier</code>.</p><ul><li>Failures\
      \ and fumbles render loot according to the below loot table, of a <em>maximum\
      \ total worth</em> no higher than the monster\u2019s xp value, counted in crowns.<sup>\u2217\
      </sup></li><li>Success on the other hand gives you roughly that maximum, plus\
      \ something extra that isn\u2019t limited in that way.</li><li>Crits let you\
      \ read from the line below (if there is one) on the loot table.</li></ul><p>See\
      \ page 121.</p><p><sup>\u2217</sup>Most of the time, it will be less. For example,\
      \ far from every Fighter is going to have things worth 90 crowns on them.</p><table\
      \ style=\"border:1px solid #000;width:90%;margin:0;margin:0 auto\"><caption>Monster\
      \ Loot (p.\_121)</caption><thead><tr class=\"header\"><th style=\"width:3em;text-align:center\"\
      >LT</th><th style=\"width:5em;text-align:left\">Category</th><th style=\"width:12em;text-align:left\"\
      >Failure</th><th style=\"width:5em;text-align:left\">Success</th></tr></thead><tbody><tr\
      \ class=\"odd\"><td style=\"text-align:center\">A</td><td style=\"text-align:left\"\
      >Animal</td><td style=\"text-align:left\">Nothing</td><td style=\"text-align:left\"\
      >Food</td></tr><tr class=\"even\"><td style=\"text-align:center\">R</td><td\
      \ style=\"text-align:left\">Regular</td><td style=\"text-align:left\">Mundane\
      \ and expected.</td><td style=\"text-align:left\">Valuable</td></tr><tr class=\"\
      odd\"><td style=\"text-align:center\">M</td><td style=\"text-align:left\">Monster</td><td\
      \ style=\"text-align:left\">Valuable but still expected.</td><td style=\"text-align:left\"\
      >Rare</td></tr><tr class=\"even\"><td style=\"text-align:center\">H</td><td\
      \ style=\"text-align:left\">Hoard</td><td style=\"text-align:left\">Valuable,\
      \ rare. Magick.</td><td style=\"text-align:left\">Artifact(s)</td></tr></tbody></table>"
