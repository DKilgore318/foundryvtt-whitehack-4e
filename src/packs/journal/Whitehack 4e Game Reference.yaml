- name: "Time and Movement (pp. 53\u201354)"
  text:
    content: "<p>See page 53.</p><dl><dt><p><strong>1 r</strong></p></dt><dd><p>Combat\
      \ round actions (p.\_56). Quaff a potion. Begin first aid (stops dying). Perform\
      \ a quick miracle. Kick in a door.</p></dd><dt><p><strong>d6 r</strong></p></dt><dd><p>Listen\
      \ at a door. Get something from a backpack. Pick a normal lock.</p></dd><dt><p><strong>10\
      \ m</strong></p></dt><dd><p>Fight\u2013loot\u2013rest. Pick a hard lock. Search\
      \ a room. Examine a potion. Finish first aid. Bash a chest. Search a door, item\
      \ or spot for traps.</p></dd><dt><p><strong>60 m</strong></p></dt><dd><p>Burn\
      \ out a regular torch.</p></dd><dt><p><strong>d6 h</strong></p></dt><dd><p>Search\
      \ a library. Gather rumors. Figure out an artifact. Advanced medical aid.</p></dd><dt><p><strong>6\
      \ h</strong></p></dt><dd><p>Minimum full night\u2019s sleep. Switch abilities\
      \ or miracles into slots. Travel \u201Ca day\u2019s journey\u201D on foot or\
      \ on a zoruk.</p></dd></dl><h2 id=\"travel-times\">Travel Times</h2><table style=\"\
      border:1px solid #000\"><caption>Typical Miles per Day Travel Rates (p.\_53)</caption><colgroup><col\
      \ style=\"width:10em\"></col><col></col><col></col><col></col></colgroup><thead><tr\
      \ class=\"header\"><th style=\"text-align:left;padding-left:0.25em\">Terrain\
      \ Type</th><th style=\"text-align:center\">Max Rate</th><th style=\"text-align:center\"\
      >Bad Weather</th><th style=\"text-align:center\">Night Travel</th></tr></thead><tbody><tr\
      \ class=\"odd\"><td style=\"text-align:left;padding-left:0.25em\">Plains</td><td\
      \ style=\"text-align:center\">24</td><td style=\"text-align:center\">12</td><td\
      \ style=\"text-align:center\">18</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\"\
      >Mountains</td><td style=\"text-align:center\">12</td><td style=\"text-align:center\"\
      >6</td><td style=\"text-align:center\">6</td></tr><tr class=\"odd\"><td style=\"\
      text-align:left;padding-left:0.25em\">Forest, Desert</td><td style=\"text-align:center\"\
      >18</td><td style=\"text-align:center\">12</td><td style=\"text-align:center\"\
      >12</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\"\
      >Arctic</td><td style=\"text-align:center\">14</td><td style=\"text-align:center\"\
      >0</td><td style=\"text-align:center\">10</td></tr><tr class=\"odd\"><td style=\"\
      text-align:left;padding-left:0.25em\">Sea, Lake, River</td><td style=\"text-align:center\"\
      >48</td><td style=\"text-align:center\">24</td><td style=\"text-align:center\"\
      >36</td></tr><tr class=\"even\"><td style=\"text-align:left;padding-left:0.25em\"\
      >Under ground</td><td style=\"text-align:center\">6</td><td style=\"text-align:center\"\
      >6</td><td style=\"text-align:center\">6</td></tr></tbody></table><h2 id=\"\
      indoor-movement\">Indoor Movement</h2><table style=\"border:1px solid #000\"\
      ><caption>Movement Rates (p.\_54)</caption><thead><tr class=\"header\"><th style=\"\
