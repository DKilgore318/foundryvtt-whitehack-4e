      \ style=\"text-align:right;padding-right:0.25em\">65</td><td style=\"text-align:center\"\
      ></td><td style=\"text-align:left;padding-left:0.25em\">Zoruk<sup>\u2217</sup>\
      \ (battle)</td><td style=\"text-align:right;padding-right:0.25em\">330</td></tr><tr\
      \ class=\"even\"><td style=\"text-align:left;padding-left:0.25em\">Map (regular\
      \ area)</td><td style=\"text-align:right;padding-right:0.25em\">95</td><td style=\"\
      text-align:center\"></td><td style=\"text-align:left;padding-left:0.25em\">Zoruk<sup>\u2217\
      </sup> (riding)</td><td style=\"text-align:right;padding-right:0.25em\">170</td></tr></tbody></table><p><sup>\u2217\
      </sup>Shevvak is a combination of shovel and short-sword. Snow Monkeys can be\
      \ trained as pets, while Zoruks are fur lizards used as riding animals. All\
      \ three are common in winter settings, but they are also examples of how to\
      \ adapt the generic equipment list to match a particular world. Swap them for\
      \ a more generic \u201Cbroad- blade,\u201D dog and horse if you like, or, in\
      \ a modern setting, you could swap them for a machete, simple bot and a motorcycle.</p>"
