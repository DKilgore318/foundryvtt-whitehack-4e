command: "let confirmed = false;\n\nnew Dialog({\n  title: \"Roll Harm Points from\
  \ HD\",\n  content: `\n      <form>\n        <div class=\"form-group\">\n      \
  \    <label style=\"text-align: right; margin-right: 0.5em;\">HD:</label>\n    \
  \      <input id=\"hd-value\" name=\"hd-value\"></input>\n        </div>\n     \
  \   <div class=\"form-group\">\n          <label style=\"text-align: right; margin-right:\
  \ 0.5em;\">\xB1:</label>\n          <input id=\"hd-modifier\" name=\"hd-modifier\"\
  \ placeholder=\"0\"></input>\n        </div>\n      </form>\n     `,\n  buttons:\
  \ {\n    one: {\n      icon: '<i class=\"fas fa-check\"></i>',\n      label: \"\
  Roll!\",\n      callback: () => (confirmed = true),\n    },\n    two: {\n      icon:\
  \ '<i class=\"fas fa-times\"></i>',\n      label: \"Cancel\",\n      callback: ()\
  \ => (confirmed = false),\n    },\n  },\n  default: \"Cancel\",\n  close: (html)\
  \ => {\n    if (confirmed) {\n      let hdLabel;\n      let rollFormula;\n     \
  \ const hd = html.find(\"[name=hd-value]\")[0].value;\n      const hdModifier =\
  \ parseInt(html.find(\"[name=hd-modifier]\")[0].value);\n      if (hdModifier >\
  \ 0) {\n        hdLabel = `${hd}+${hdModifier}`;\n        rollFormula = `${hd}d6+${hdModifier}`;\n\
  \      } else if (hdModifier < 0) {\n        hdLabel = `${hd}${hdModifier}`;\n \
  \       rollFormula = `{${hd}d6${hdModifier},1}kh`;\n      } else {\n        hdLabel\
  \ = hd;\n        rollFormula = `${hd}d6`;\n      }\n      let label = `Roll Harm\
  \ Points for HD: ${hdLabel}`;\n      let message = `\n        <table>\n        \
  \  <tbody>\n            <tr class=\"odd\">\n              <td style=\"text-align:\
  \ right;\">1\u20135: </td>\n              <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n\
  \              <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n      \
  \        <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n            \
  \  <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"\
  text-align: right;\">[[${rollFormula}]]</td>\n            </tr>\n            <tr\
  \ class=\"even\">\n              <td style=\"text-align: right;\">6\u201310: </td>\n\
  \              <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n      \
  \        <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n            \
  \  <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"\
  text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"text-align:\
  \ right;\">[[${rollFormula}]]</td>\n            </tr>\n            <tr class=\"\
  odd\">\n              <td style=\"text-align: right;\">11\u201315: </td>\n     \
  \         <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n           \
  \   <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td\
  \ style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"\
  text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"text-align:\
  \ right;\">[[${rollFormula}]]</td>\n            </tr>\n            <tr class=\"\
  even\">\n              <td style=\"text-align: right;\">16\u201320: </td>\n    \
  \          <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n          \
  \    <td style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td\
  \ style=\"text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"\
  text-align: right;\">[[${rollFormula}]]</td>\n              <td style=\"text-align:\
  \ right;\">[[${rollFormula}]]</td>\n            </tr>\n          </tbody>\n    \
  \    </table>\n      `;\n      ChatMessage.create({\n        content: message,\n\
  \        whisper: game.users.filter((u) => u.isGM).map((u) => u.id),\n        blind:\
  \ true,\n        flavor: label,\n      });\n    }\n  },\n}).render(true);"
