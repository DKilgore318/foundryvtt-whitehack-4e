name: Critical Attack (Self Roll)
type: script
author: kHDgurX1WEPIJDaV
img: icons/skills/melee/swords-parry-block-yellow.webp
scope: global
command: 'const packName = "whitehack4e.roll-table";

  const tableName = "Crits";


  const pack = game.packs.get(packName);

  await pack.getIndex();

  let rollTable = pack.index.find(rt => rt.name == tableName);

  pack.getDocument(rollTable._id).then(table => table.draw({rollMode: CONST.DICE_ROLL_MODES.SELF}));'
sort: 300000
