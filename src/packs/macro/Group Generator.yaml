scope: global
command: 'const packName = "whitehack4e.roll-table";

  const tableName = "Group Generator";


  const pack = game.packs.get(packName);

  await pack.getIndex();

  let rollTable = pack.index.find(rt => rt.name == tableName);

  pack.getDocument(rollTable._id).then(table => table.draw({rollMode: CONST.DICE_ROLL_MODES.PUBLIC}));'
sort: 500000
